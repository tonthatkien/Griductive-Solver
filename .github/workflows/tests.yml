name: tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  unittest:
    runs-on: ubuntu-latest
    defaults:
      run:
        # Đổi theo tên thư mục nộp bài thật (MSSV1_MSSV2_...)
        working-directory: MSSV1_MSSV2_MSSV3_MSSV4/Source
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # Test không phụ thuộc GUI nên không cần cài pygame
      - name: Run unit tests
        run: python -m unittest discover -s tests -t .
